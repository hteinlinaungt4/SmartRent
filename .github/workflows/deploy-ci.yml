name: SmartRent CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: hteinlinaung/smartrent:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/SmartRent
            
            # 1. Kill everything and remove the network to clear DNS cache
            docker compose down --remove-orphans || true
            docker network prune -f || true

            cat <<EOF > docker-compose.yml
            services:
              smartrent-api:
                image: hteinlinaung/smartrent:latest
                container_name: smartrent-api
                restart: always
                environment:
                  - ASPNETCORE_ENVIRONMENT=Production
                  # Ensure NO spaces around '=' and NO quotes around the value
                  - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=smartrent_db;Username=postgres;Password=mypassword;
                depends_on:
                  - db
                networks:
                  - smartrent-net

              db:
                image: postgres:latest
                container_name: postgres-db
                restart: always
                environment:
                  - POSTGRES_USER=postgres
                  - POSTGRES_PASSWORD=mypassword
                  - POSTGRES_DB=smartrent_db
                networks:
                  - smartrent-net

            networks:
              smartrent-net:
                driver: bridge
            EOF

            docker compose pull
            docker compose up -d
            
            # Add this: Wait for Postgres to actually be ready to accept connections
            echo "Waiting for database to be ready..."
            until docker exec postgres-db pg_isready -U postgres; do
              sleep 2
            done

            # Now restart the API to ensure it gets a fresh connection to the ready DB
            docker restart smartrent-api
            
            docker image prune -f

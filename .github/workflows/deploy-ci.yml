name: SmartRent CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: hteinlinaung/smartrent:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/SmartRent
            cd ~/SmartRent

            docker compose down || true

            cat <<EOF > docker-compose.yml
            services:
              smartrent-api:
                image: hteinlinaung/smartrent:latest
                container_name: smartrent-api
                ports:
                  - "8080:80"
                environment:
                  ASPNETCORE_ENVIRONMENT: Production
                  ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=smartrent_db;Username=postgres;Password=mypassword
                depends_on:
                  - db
                networks:
                  - smartrent-net

              db:
                image: postgres:latest
                container_name: postgres-db
                restart: always
                environment:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: mypassword
                  POSTGRES_DB: smartrent_db
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - smartrent-net

            networks:
              smartrent-net:
                driver: bridge

            volumes:
              postgres_data:
            EOF

            docker compose pull
            docker compose up -d
            docker image prune -f

name: SmartRent CI/CD

on:
  push:
    branches: [ main ] # Trigger on push to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Use your specific repository name here
          tags: hteinlinaung/donetwithcicd:latest

  deploy:
    needs: build-and-push # Only run if build succeeds
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Pull the new image from Docker Hub
            docker pull hteinlinaung/donetwithcicd:latest
            # 2. Stop and remove the old container
            docker stop smartrent-api || true
            docker rm smartrent-api || true
            # 3. Run the new container
            docker run -d --name smartrent-api -p 8080:80 hteinlinaung/donetwithcicd:latest
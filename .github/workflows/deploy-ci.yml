name: SmartRent CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Cache သုံးခြင်းဖြင့် နောက်တစ်ကြိမ် build ရင် ပိုမြန်စေသည်
          cache-from: type=gha
          cache-to: type=inline
          tags: hteinlinaung/smartrent:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/SmartRent && cd ~/SmartRent
            
            # Docker DNS issues ကာကွယ်ရန် clean up လုပ်ခြင်း
            docker compose down --remove-orphans || true
            docker network prune -f || true

            # Docker Compose ဖိုင်ကို Dynamic ဆောက်ခြင်း
            cat <<EOF > docker-compose.yml
            version: "3.9"
            services:
              smartrent-api:
                image: hteinlinaung/smartrent:latest
                container_name: smartrent-api
                restart: always
                ports:
                  - "8080:8080"
                environment:
                  - ASPNETCORE_ENVIRONMENT=Production
                  - "ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=smartrent_db;Username=postgres;Password=${{ secrets.DB_PASSWORD }}"
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - smartrent-net

              db:
                image: postgres:15-alpine
                container_name: postgres-db
                restart: always
                environment:
                  - POSTGRES_USER=postgres
                  - POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
                  - POSTGRES_DB=smartrent_db
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
                networks:
                  - smartrent-net

            networks:
              smartrent-net:
                driver: bridge

            volumes:
              postgres_data:
            EOF

            # Deploy လုပ်ခြင်း
            docker compose pull
            docker compose up -d

            # မလိုတဲ့ image အဟောင်းတွေကို ဖျက်ထုတ်ခြင်း (Disk space သက်သာစေရန်)
            docker image prune -f
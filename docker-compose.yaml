version: "3.9"

services:
  smartrent-api:
    image: hteinlinaung/smartrent:latest
    container_name: smartrent-api
    restart: always  # API ပျက်သွားရင် auto ပြန်တက်အောင်
    ports:
      - "8080:80"  # Container port ကို 8080 လို့ ယူဆထားပါတယ်
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=smartrent_db;Username=postgres;Password=mypassword123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartrent-net

  db:
    image: postgres:15-alpine # 'latest' အစား version အသေသုံးတာက ပိုငြိမ်ပါတယ် (alpine က image ပိုသေးတယ်)
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword123
      POSTGRES_DB: smartrent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U postgres အစား environment မှာ ပေးထားတဲ့ user name ကို သုံးပါ
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartrent_db"]
      interval: 10s   # စောင့်ရမယ့် အချိန်ကို နည်းနည်း ထပ်တိုးကြည့်ပါ
      timeout: 5s
      retries: 10     # ကြိုးစားတဲ့ အကြိမ်ရေကို ၅ ကြိမ်ကနေ ၁၀ ကြိမ်အထိ တိုးပေးပါ
      start_period: 10s # Container စတက်ချင်းမှာ စစ်ဆေးတာကို ခဏစောင့်ပေးဖို့
    networks:
      - smartrent-net

networks:
  smartrent-net:
    driver: bridge

volumes:
  postgres_data:
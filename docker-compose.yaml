version: "3.9"

services:
  smartrent-api:
    image: hteinlinaung/smartrent:latest
    container_name: smartrent-api
    restart: always  # API ပျက်သွားရင် auto ပြန်တက်အောင်
    ports:
      - "8080:8080"  # Container port ကို 8080 လို့ ယူဆထားပါတယ်
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=smartrent_db;Username=postgres;Password=mypassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartrent-net

  db:
    image: postgres:15-alpine # 'latest' အစား version အသေသုံးတာက ပိုငြိမ်ပါတယ် (alpine က image ပိုသေးတယ်)
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: smartrent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s # ခဏခဏစစ်လွန်းရင် resource စားလို့ interval ကို နည်းနည်းတိုးထားပါတယ်
      timeout: 5s
      retries: 5
    networks:
      - smartrent-net

networks:
  smartrent-net:
    driver: bridge

volumes:
  postgres_data: